
bundle:
  name: spotify_dab
  uuid: c82b92c5-8c64-45d3-8521-58c6ee2c0c52

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.azuredatabricks.net
      #root_path: /Workspace/Users/<your-user>/.bundle/${bundle.name}/${bundle.target}
    presets:
      source_linked_deployment: false
      
    variables:
      catalog: hive_metastore
      schema: dev

  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/<your-user> to make sure we only have a single copy.
      root_path: /Workspace/prod_environment/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hive_metastore
      schema: prod
    permissions:
      - user_name: <your-user>
        level: CAN_MANAGE
      - user_name: <your-user>
        level: CAN_MANAGE

